apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-sync-operator
rules:
# Permissions for Secrets (core functionality)
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch

# Permissions for Events (optional, for better observability)
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch

# Permissions for SynchronizedSecrets (custom resources)
- apiGroups:
  - app.gamesight.io
  resources:
  - synchronizedsecrets
  verbs:
  - get
  - list
  - watch
  - update
  - patch

# Permissions for SynchronizedSecrets status
- apiGroups:
  - app.gamesight.io
  resources:
  - synchronizedsecrets/status
  verbs:
  - get
  - update
  - patch

# Permissions for SynchronizedSecrets finalizers
- apiGroups:
  - app.gamesight.io
  resources:
  - synchronizedsecrets/finalizers
  verbs:
  - update
