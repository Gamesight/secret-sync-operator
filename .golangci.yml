version: "2"

run:
  timeout: 10m
  tests: true
  build-tags:
    - integration
  skip-dirs:
    - vendor
    - build

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    enable-all: true
    settings:
      shadow:
        strict: true

  gocyclo:
    min-complexity: 15

  dupl:
    threshold: 100

  goconst:
    min-len: 3
    min-occurrences: 3

  misspell:
    locale: US

  lll:
    line-length: 140

  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - wrapperFunc
      - hugeParam

  funlen:
    lines: 80
    statements: 80

  gocognit:
    min-complexity: 25

  nestif:
    min-complexity: 6

  revive:
    severity: warning
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unused-parameter
      - name: unreachable-code
      - name: redefines-builtin-id

linters:
  disable-all: true
  enable:
    # Enabled by default
    - errcheck      # Checking for unchecked errors
    - govet         # Reports suspicious constructs
    - ineffassign   # Detects unused assignments
    - staticcheck   # Advanced Go linter
    - unused        # Checks for unused constants, variables, functions and types

    # Additional recommended linters
    - bodyclose     # Checks HTTP response body is closed
    - dupl          # Code clone detection
    - gocyclo       # Cyclomatic complexity
    - gosec         # Security problems
    - misspell      # Finds commonly misspelled English words
    - nakedret      # Finds naked returns
    - prealloc      # Finds slice declarations that could potentially be pre-allocated
    - revive        # Fast, configurable, extensible, flexible linter
    - unconvert     # Remove unnecessary type conversions
    - unparam       # Reports unused function parameters
    - whitespace    # Detection of unnecessary whitespace

    # Code quality
    - gocognit      # Cognitive complexity
    - goconst       # Repeated strings that could be constants
    - gocritic      # Comprehensive Go source code linter
    - nolintlint    # Reports ill-formed or insufficient nolint directives

    # Performance
    - prealloc      # Finds slice declarations that could be pre-allocated

    # Style
    - lll           # Reports long lines

    # Disabled for controller code - main and reconcile functions are reasonably sized
    # - funlen      # Detects long functions
    # - nestif      # Reports deeply nested if statements

issues:
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - gosec
        - dupl
        - funlen
        - gocognit

    # Exclude generated files
    - path: zz_generated.*\.go
      linters:
        - goimports
        - gofmt
        - revive
        - stylecheck

    # Exclude known issues that are acceptable
    - text: "shadow: declaration of \"err\""
      linters:
        - govet

    # Increase the max-per-linter for specific linters
    - linters:
        - stylecheck
      text: "ST1003:"

    # Allow long main function
    - text: "Function 'main' is too long"
      linters:
        - funlen

    # Allow long Reconcile function
    - text: "Function 'Reconcile' is too long"
      linters:
        - funlen

    # Allow nested if in controller error handling
    - text: "`if err != nil` has complex nested blocks"
      linters:
        - nestif

  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  uniq-by-line: true
  sort-results: true
